<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alat Perbandingan Gambar</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/image-compare-viewer/dist/image-compare-viewer.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Aplikasi Model</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Tebak Gambar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/bandingkan">Perbandingan Gambar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <h1>Alat Uji Perbandingan Hasil Model</h1>
        <p>Memberikan Comparison dari gambar hasil Model.</p>
        <div class="upload-section">
            <div class="upload-area">
                <label for="image1-input">Pilih Hasil Gambar dari Model 1:</label>
                <input type="file" id="image1-input" accept="image/*">
            </div>
            <div class="upload-area">
                <label for="image2-input">Pilih Hasil Gambar dari Model 2:</label>
                <input type="file" id="image2-input" accept="image/*">
            </div>
        </div>
        <button id="compare-btn">Bandingkan Model</button>
        <div id="image-compare-container"></div>
    </div>

    <script src="https://unpkg.com/image-compare-viewer/dist/image-compare-viewer.min.js"></script>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
