<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Kebersihan Lingkungan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Sedikit style tambahan */
        body {
            background-color: #f8f9fa;
        }
        .card {
            max-width: 500px;
            margin: 2rem auto;
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 0.375rem;
            display: none; /* Sembunyikan secara default */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Prediksi Kebersihan Lingkungan</h2>
                
                <div class="mb-3">
                    <label for="imageUpload" class="form-label">Pilih Gambar untuk Dideteksi:</label>
                    <input class="form-control" type="file" id="imageUpload" accept="image/*">
                </div>

                <div class="mt-4 text-center">
                    <img id="imagePreview" src="#" alt="Pratinjau Gambar">
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button id="predictBtn" class="btn btn-primary" type="button" disabled>
                        <span id="spinner" class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
                        <span id="btn-text">Prediksi Lingkungannya</span>
                    </button>
                </div>
                
                <div id="resultArea" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script>
        // Menghubungkan elemen HTML ke JavaScript
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const predictBtn = document.getElementById('predictBtn');
        const resultArea = document.getElementById('resultArea');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btn-text');

        // Fungsi yang berjalan saat pengguna memilih gambar
        imageUpload.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block'; // Tampilkan pratinjau
                };
                reader.readAsDataURL(this.files[0]);
                predictBtn.disabled = false; // Aktifkan tombol prediksi
                resultArea.innerHTML = ''; // Kosongkan hasil sebelumnya
            }
        });

        // Fungsi yang berjalan saat tombol prediksi diklik
        predictBtn.addEventListener('click', async function() {
            const file = imageUpload.files[0];
            if (!file) return;

            // Tampilkan spinner dan nonaktifkan tombol
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Memprediksi...';
            predictBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                // Kirim gambar ke backend Flask
                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    body: formData,
                });
                
                if (!response.ok) {
                    throw new Error(`Error dari server: ${response.statusText}`);
                }

                const data = await response.json();
                displayResult(data.prediction);

            } catch (error) {
                console.error('Error:', error);
                displayResult('error', 'Tidak dapat terhubung ke server. Pastikan backend berjalan.');
            } finally {
                // Sembunyikan spinner dan kembalikan teks tombol
                spinner.style.display = 'none';
                btnText.textContent = 'Prediksi Sekarang';
                predictBtn.disabled = false;
            }
        });

        // Fungsi untuk menampilkan hasil dengan warna yang sesuai
        function displayResult(prediction, message = '') {
            let alertClass = '';
            let resultText = '';
            console.log('Prediksi:', prediction);

            switch (prediction) {
                case 'sangat_bersih':
                    alertClass = 'alert-success';
                    resultText = 'Hasil Prediksi: <strong>Bersih</strong>';
                    break;
                case 'sedang':
                    alertClass = 'alert-warning';
                    resultText = 'Hasil Prediksi: <strong>Sedang</strong>';
                    break;
                case 'sangat_kotor':
                    alertClass = 'alert-danger';
                    resultText = 'Hasil Prediksi: <strong>Sangat Kotor</strong>';
                    break;
                default:
                    alertClass = 'alert-danger';
                    resultText = `<strong>Error:</strong> ${message || 'Prediksi tidak dikenal.'}`;
            }

            resultArea.innerHTML = `<div class="alert ${alertClass}" role="alert">${resultText}</div>`;
        }
    </script>
</body>
</html>
